<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interrupt Stack</title>
<meta name="theme-color" content="#1c6b58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Interrupts">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header>
    <h1>Interrupt stack</h1>
    <div class="meta">
      <span id="depth">0 deep</span>
      <span><span id="dot" class="dot"></span><span id="status">Connecting</span></span>
    </div>
  </header>

  <form id="push-form" autocomplete="off">
    <input type="text" id="push-input" maxlength="200" placeholder="What are you starting now?" aria-label="New task to push onto the stack">
    <button type="submit" class="primary" id="push-btn">Push</button>
  </form>

  <p class="note" id="note" hidden></p>

  <div class="update" id="update" hidden>
    <span>A new version of the app is available.</span>
    <button type="button" class="primary" id="update-btn">Refresh app</button>
  </div>

  <section id="now-wrap" aria-live="polite"></section>

  <div class="toast" id="toast" hidden>
    <span id="toast-text"></span>
    <button type="button" id="undo-btn">Undo</button>
  </div>

  <section class="under" id="under-wrap" hidden>
    <div class="label">Underneath, most recent first</div>
    <ol id="under"></ol>
  </section>
  <footer>
    <button type="button" class="quiet" id="refresh-btn">Refresh app</button>
    <span id="refresh-msg" role="status"></span>
  </footer>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
