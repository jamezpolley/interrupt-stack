services:
  interrupt-stack:
    build: .
    restart: unless-stopped
    # No host port is published, so nothing is reachable on the host's localhost.
    # Attach your reverse proxy or agent to the "interrupt-stack" network below; see the README.
    # There is no authentication and no TLS in this container: put both in front of it.
    networks:
      - interrupt-stack
    volumes:
      - interrupt-stack-data:/data
    # Pangolin resource labels. INTERRUPT_STACK_DOMAIN and INTERRUPT_STACK_POLICY come from the
    # stack's environment (Dockhand's variables panel or a .env file); leave them unset if you do not use Pangolin.
    labels:
      pangolin.public-resources.interrupt-stack.name: interrupt-stack
      pangolin.public-resources.interrupt-stack.protocol: http
      pangolin.public-resources.interrupt-stack.full-domain: ${INTERRUPT_STACK_DOMAIN:-}
      pangolin.public-resources.interrupt-stack.policy: ${INTERRUPT_STACK_POLICY:-}
      pangolin.public-resources.interrupt-stack.targets[0].method: http
      pangolin.public-resources.interrupt-stack.targets[0].hostname: interrupt-stack
      pangolin.public-resources.interrupt-stack.targets[0].port: 9958
      pangolin.public-resources.interrupt-stack.targets[0].healthcheck.enabled: true
      pangolin.public-resources.interrupt-stack.targets[0].healthcheck.hostname: interrupt-stack
      pangolin.public-resources.interrupt-stack.targets[0].healthcheck.port: 9958
      pangolin.public-resources.interrupt-stack.targets[0].healthcheck.path: /healthz

networks:
  interrupt-stack:
    # A fixed name, so other stacks can attach to it as an external network whatever this stack is called.
    name: interrupt-stack

volumes:
  interrupt-stack-data:
